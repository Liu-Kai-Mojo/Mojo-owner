<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner — Create</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><header class="topbar"><img src="assets/logo.png" class="brand-mini"></header><main class="container owner-content"><div class="section-head"><div><span class="kpi">Owner tools</span><h2 class="section-title">Create account</h2></div><a class="btn secondary" href="index.html">Back</a></div><div class="grid grid-2"><section class="card"><span class="kpi">Administrator</span><h3>Create Admin</h3><form id="adminForm"><div class="field"><label>Name</label><input class="light-input" name="name" required></div><div class="field"><label>Email</label><input class="light-input" name="email" type="email" required></div><div class="field"><label>Password</label><input class="light-input" name="password" type="password" minlength="10" required></div><button class="btn">Create Admin</button><div id="adminMsg" class="notice" style="display:none;margin-top:10px"></div></form></section><section class="card"><span class="kpi">Client</span><h3>Create Client</h3><form id="clientForm"><div class="field"><label>Name</label><input class="light-input" name="name" required></div><div class="field"><label>Phone</label><input class="light-input" name="phone" required></div><div class="field"><label>Admin</label><select class="light-input" id="adminId" name="adminId" required></select></div><div class="field"><label>Password</label><input class="light-input" name="password" type="password" minlength="10" required></div><div class="field"><label>Withdrawal Password</label><input class="light-input" name="withdrawalPassword" type="password" minlength="10" required></div><button class="btn">Create Client</button><div id="clientMsg" class="notice" style="display:none;margin-top:10px"></div></form></section></div></main><script src="config.js"></script><script type="module">import{init,api}from'./scripts/common.js';if(init()){const a=document.getElementById('adminForm'),c=document.getElementById('clientForm'),sel=document.getElementById('adminId');const msg=(id,text,ok)=>{const e=document.getElementById(id);e.textContent=text;e.style.display='block'};const load=async()=>{const d=await api('/api/owner/overview');sel.innerHTML=d.admins.filter(x=>x.status==='active').map(x=>`<option value="${x.id}">${x.name} — ${x.email}</option>`).join('')||'<option value="">No active Admin</option>'};a.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/owner/create-admin',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(a)))});msg('adminMsg','Created. Invite code: '+d.inviteCode,true);a.reset();await load()}catch(e){msg('adminMsg',e.message,false)}};c.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/owner/create-client',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(c)))});msg('clientMsg','Created. Invite code: '+d.inviteCode,true);c.reset();await load()}catch(e){msg('clientMsg',e.message,false)}};load().catch(e=>msg('clientMsg',e.message,false))}</script></body></html>
