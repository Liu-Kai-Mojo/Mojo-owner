<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner — Clients</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><aside class="side-nav"><img src="assets/logo.png" class="side-logo"><a href="index.html">Overview</a><a href="transactions.html">Wallets</a><a href="messages.html">Messages</a><a href="admins.html">Admins</a><a class="active" href="clients.html">Clients</a></aside><header class="topbar"><img src="assets/logo.png" class="brand-mini"></header><main class="container owner-content"><div class="section-head"><div><span class="kpi">Users</span><h2 class="section-title">Clients</h2></div></div><section class="card contact-card"><div class="contact-head"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="light-input" placeholder="Search Client UID"></div></div><div class="contact-list" id="rows"></div></section></main><nav class="bottom-nav"><a href="index.html">Overview</a><a href="transactions.html">Wallets</a><a href="messages.html">Messages</a><a href="admins.html">Admins</a><a class="active" href="clients.html">Clients</a></nav><div class="modal-backdrop" id="modal"><section class="modal"><div class="modal-head"><div><span class="kpi">Client</span><h2 id="mTitle" style="margin:5px 0">Client</h2></div><button class="close-btn" data-close>×</button></div><form id="form"><div class="detail-grid"><div class="detail"><span>UID</span><strong id="uid"></strong></div><div class="detail"><span>Admin UID</span><strong id="admin"></strong></div></div><div class="field"><label>Name</label><input class="light-input" id="name"></div><div class="field"><label>Phone</label><input class="light-input" id="phone"></div><div class="detail-grid"><div class="field"><label>Asset balance</label><input class="light-input" id="asset" type="number" min="0" step="0.01"></div><div class="field"><label>Commission balance</label><input class="light-input" id="commission" type="number" min="0" step="0.01"></div><div class="field"><label>Credit score</label><input class="light-input" id="credit" type="number" min="0"></div><div class="field"><label>Total tasks</label><input class="light-input" id="tasks" type="number" min="0"></div></div><div class="modal-actions"><button class="btn" type="submit">Save</button><button class="btn warn" type="button" id="ban">Ban</button><button class="btn secondary" type="button" id="toggle">Suspend</button><button class="btn danger" type="button" id="delete">Delete</button></div></form></section></div><script src="config.js"></script><script type="module">import{init,api,esc,initials}from'./scripts/common.js';if(init()){let list=[],selected=null;const $=id=>document.getElementById(id);const render=()=>{const q=$('search').value.toLowerCase();$('rows').innerHTML=list.filter(x=>x.id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).map(x=>`<button class="contact-row" data-id="${x.id}"><span class="avatar">${initials(x.name)}</span><span class="contact-main"><span class="contact-name">${esc(x.name)}</span><span class="contact-meta">UID ${esc(x.id)} · ${esc(x.phone)}</span></span><span class="contact-side"><span class="status-dot ${x.status==='active'?'active':x.status==='banned'?'banned':''}"></span>${esc(x.status)}<br>$${Number(x.assetBalance||0).toFixed(2)}</span></button>`).join('')||'<div class="empty">No clients found.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(list.find(x=>x.id===b.dataset.id)))};const open=x=>{selected=x;$('mTitle').textContent=x.name;$('uid').textContent=x.id;$('admin').textContent=x.adminId||'—';$('name').value=x.name||'';$('phone').value=x.phone||'';$('asset').value=Number(x.assetBalance||0);$('commission').value=Number(x.commissionBalance||0);$('credit').value=Number(x.creditScore||0);$('tasks').value=Number(x.totalTasks||0);$('ban').textContent=x.status==='banned'?'Unban':'Ban';$('toggle').textContent=x.status==='active'?'Suspend':'Activate';$('modal').classList.add('open')};const close=()=>$('modal').classList.remove('open');const saveChange=async body=>{const d=await api('/api/owner/clients/'+selected.id,{method:'PATCH',body:JSON.stringify(body)});list=list.map(x=>x.id===d.id?d:x);render();open(d)};$('form').onsubmit=async e=>{e.preventDefault();try{await saveChange({name:$('name').value,phone:$('phone').value,assetBalance:$('asset').value,commissionBalance:$('commission').value,creditScore:$('credit').value,totalTasks:$('tasks').value})}catch(e){alert(e.message)}};$('ban').onclick=async()=>{try{await saveChange({status:selected.status==='banned'?'active':'banned'})}catch(e){alert(e.message)}};$('toggle').onclick=async()=>{try{await saveChange({status:selected.status==='active'?'suspended':'active'})}catch(e){alert(e.message)}};$('delete').onclick=async()=>{if(!confirm('Delete this Client and its messages?'))return;try{await api('/api/owner/clients/'+selected.id,{method:'DELETE'});list=list.filter(x=>x.id!==selected.id);close();render()}catch(e){alert(e.message)}};$('search').oninput=render;$('[data-close]').onclick=close;api('/api/owner/overview').then(d=>{list=d.clients;render()}).catch(e=>$('rows').innerHTML='<div class="empty">'+esc(e.message)+'</div>')}</script></body></html>
