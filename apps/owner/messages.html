<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner — Messages</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><aside class="side-nav"><img src="assets/logo.png" class="side-logo"><a href="index.html">Overview</a><a href="transactions.html">Wallets</a><a class="active" href="messages.html">Messages</a><a href="admins.html">Admins</a><a href="clients.html">Clients</a></aside><header class="topbar"><img src="assets/logo.png" class="brand-mini"></header><main class="container owner-content"><div><span class="kpi">Communication</span><h2 class="section-title">Messages</h2></div><section class="card contact-card"><div class="contact-head"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="light-input" placeholder="Search Client UID"></div></div><div class="contact-list" id="rows"></div></section></main><nav class="bottom-nav"><a href="index.html">Overview</a><a href="transactions.html">Wallets</a><a class="active" href="messages.html">Messages</a><a href="admins.html">Admins</a><a href="clients.html">Clients</a></nav><div class="modal-backdrop" id="modal"><section class="modal"><div class="modal-head"><div><span class="kpi">Conversation</span><h2 id="mTitle" style="margin:5px 0">Client</h2></div><button class="close-btn" data-close>×</button></div><div id="profile"></div><div class="chat-box" id="chat"></div><form id="send" style="margin-top:12px"><textarea class="light-input" id="text" rows="3" placeholder="Message this client..."></textarea><button class="btn" style="width:100%;margin-top:8px">Send</button></form><div class="modal-actions"><button class="btn warn" type="button" id="ban">Ban</button><button class="btn secondary" type="button" id="toggle">Suspend</button><button class="btn danger" type="button" id="delete">Delete</button></div></section></div><script src="config.js"></script><script type="module">import{init,api,esc,initials}from'./scripts/common.js';if(init()){let list=[],selected=null;const $=id=>document.getElementById(id);const render=()=>{const q=$('search').value.toLowerCase();$('rows').innerHTML=list.filter(x=>x.id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).map(x=>`<button class="contact-row" data-id="${x.id}"><span class="avatar">${initials(x.name)}</span><span class="contact-main"><span class="contact-name">${esc(x.name)}</span><span class="contact-meta">UID ${esc(x.id)} · ${esc(x.phone)}</span></span><span class="contact-side"><span class="status-dot ${x.status==='active'?'active':x.status==='banned'?'banned':''}"></span>${esc(x.status)}</span></button>`).join('')||'<div class="empty">No contacts found.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(list.find(x=>x.id===b.dataset.id)))};const open=async x=>{selected=x;$('mTitle').textContent=x.name;$('profile').innerHTML=`<div class="detail-grid"><div class="detail"><span>UID</span><strong>${esc(x.id)}</strong></div><div class="detail"><span>Phone</span><strong>${esc(x.phone)}</strong></div><div class="detail"><span>Balance</span><strong>$${Number(x.assetBalance||0).toFixed(2)}</strong></div><div class="detail"><span>Status</span><strong>${esc(x.status)}</strong></div></div>`;$('ban').textContent=x.status==='banned'?'Unban':'Ban';$('toggle').textContent=x.status==='active'?'Suspend':'Activate';$('modal').classList.add('open');await loadChat()};const loadChat=async()=>{const ms=await api('/api/messages/owner?clientId='+encodeURIComponent(selected.id));$('chat').innerHTML=ms.map(m=>`<div class="message ${m.fromRole==='owner'?'mine':''}"><b>${esc(m.fromRole)}</b><div>${esc(m.text||'')}</div><small>${new Date(m.createdAt).toLocaleString()}</small></div>`).join('')||'<div class="empty">No messages yet.</div>';$('chat').scrollTop=$('chat').scrollHeight};const close=()=>$('modal').classList.remove('open');$('send').onsubmit=async e=>{e.preventDefault();if(!$('text').value.trim())return;try{await api('/api/messages/owner',{method:'POST',body:JSON.stringify({clientId:selected.id,text:$('text').value})});$('text').value='';await loadChat()}catch(e){alert(e.message)}};$('ban').onclick=async()=>{try{const d=await api('/api/owner/clients/'+selected.id,{method:'PATCH',body:JSON.stringify({status:selected.status==='banned'?'active':'banned'})});list=list.map(x=>x.id===d.id?d:x);render();open(d)}catch(e){alert(e.message)}};$('toggle').onclick=async()=>{try{const d=await api('/api/owner/clients/'+selected.id,{method:'PATCH',body:JSON.stringify({status:selected.status==='active'?'suspended':'active'})});list=list.map(x=>x.id===d.id?d:x);render();open(d)}catch(e){alert(e.message)}};$('delete').onclick=async()=>{if(!confirm('Delete this Client and its messages?'))return;try{await api('/api/owner/clients/'+selected.id,{method:'DELETE'});list=list.filter(x=>x.id!==selected.id);close();render()}catch(e){alert(e.message)}};$('search').oninput=render;$('[data-close]').onclick=close;api('/api/owner/overview').then(d=>{list=d.clients;render()}).catch(e=>$('rows').innerHTML='<div class="empty">'+esc(e.message)+'</div>')}</script></body></html>
