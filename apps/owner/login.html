<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BoxOffice — Owner Login</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body class="auth-page"><main class="auth-layout"><header class="auth-topbar"><img src="assets/logo.png" class="auth-logo" alt="Box Office Mojo"></header><section class="auth-box"><span class="kpi">Secure access</span><h1 class="auth-title">Owner Login</h1><p class="auth-sub">Sign in to manage the entire platform.</p><form id="login" novalidate><div class="field"><label>Email / Phone Number</label><input class="input" name="email" autocomplete="username" placeholder="Type your email or number" required></div><div class="field"><label>Password</label><div class="password-wrap"><input class="input" id="passwordInput" name="password" type="password" autocomplete="current-password" placeholder="....." required><button class="password-toggle" type="button" id="passwordToggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div></div><div class="auth-options"><label class="remember"><input id="rememberMe" type="checkbox"> Remember me</label><a class="forgot-link" href="support.html">Forgot password?</a></div><div id="msg" class="auth-message"></div><button class="btn" type="submit">Login Now</button></form></section></main><script src="config.js"></script><script type="module" src="scripts/auth.js"></script><script>const p=document.getElementById('passwordInput'),b=document.getElementById('passwordToggle');b.onclick=()=>{const show=p.type==='password';p.type=show?'text':'password';b.setAttribute('aria-label',show?'Hide password':'Show password');b.innerHTML=show?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.3A10.7 10.7 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3.2 3.9M6.1 6.1C3.8 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.2 0 2.3-.2 3.3-.6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg>'}</script></body></html>
