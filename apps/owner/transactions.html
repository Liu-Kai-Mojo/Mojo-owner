<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Owner — Wallets</title><link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><aside class="side-nav"><img src="assets/logo.png" class="side-logo"><a href="index.html">Overview</a><a class="active" href="transactions.html">Wallets</a><a href="messages.html">Messages</a><a href="admins.html">Admins</a><a href="clients.html">Clients</a></aside><header class="topbar"><img src="assets/logo.png" class="brand-mini"></header><main class="container owner-content"><div class="section-head"><div><span class="kpi">Finance</span><h2 class="section-title">Wallets</h2></div></div><section class="card contact-card"><div class="contact-head"><div class="search-wrap"><span class="search-icon">⌕</span><input id="search" class="light-input" placeholder="Search users by UID"></div></div><div class="contact-list" id="rows"></div></section></main><nav class="bottom-nav"><a href="index.html">Overview</a><a class="active" href="transactions.html">Wallets</a><a href="messages.html">Messages</a><a href="admins.html">Admins</a><a href="clients.html">Clients</a></nav><div class="modal-backdrop" id="modal"><section class="modal"><div class="modal-head"><div><span class="kpi">Wallet record</span><h2 id="mTitle" style="margin:5px 0">User</h2></div><button class="close-btn" data-close>×</button></div><div id="details"></div></section></div><script src="config.js"></script><script type="module">import{init,api,esc,initials}from'./scripts/common.js';if(init()){let all=[];const $=id=>document.getElementById(id);const render=()=>{const q=$('search').value.toLowerCase();$('rows').innerHTML=all.filter(x=>x.id.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).map(x=>`<button class="contact-row" data-id="${x.id}"><span class="avatar">${initials(x.name)}</span><span class="contact-main"><span class="contact-name">${esc(x.name)}</span><span class="contact-meta">${x.role.toUpperCase()} · UID ${esc(x.id)}</span></span><span class="contact-side"><strong>$${Number(x.assetBalance||0).toFixed(2)}</strong><br>Commission $${Number(x.commissionBalance||0).toFixed(2)}</span></button>`).join('')||'<div class="empty">No users found.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(all.find(x=>x.id===b.dataset.id)))};const open=x=>{$('mTitle').textContent=x.name;$('details').innerHTML=`<div class="detail-grid"><div class="detail"><span>UID</span><strong>${esc(x.id)}</strong></div><div class="detail"><span>Role</span><strong>${esc(x.role)}</strong></div><div class="detail"><span>Asset balance</span><strong>$${Number(x.assetBalance||0).toFixed(2)}</strong></div><div class="detail"><span>Commission</span><strong>$${Number(x.commissionBalance||0).toFixed(2)}</strong></div></div>`;$('modal').classList.add('open')};document.querySelector('[data-close]').onclick=()=>$('modal').classList.remove('open');$('search').oninput=render;api('/api/owner/overview').then(d=>{all=[...d.admins.map(x=>({...x,role:'admin'})),...d.clients.map(x=>({...x,role:'client'}))];render()}).catch(e=>$('rows').innerHTML='<div class="empty">'+esc(e.message)+'</div>')}</script></body></html>
