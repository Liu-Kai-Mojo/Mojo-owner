<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c83"><title>Owner — Orders</title><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="stylesheet" href="styles/app.css"></head><body><header class="topbar"><img src="logo.png" class="brand-mini" alt="Logo"><h1>Orders &amp; Commissions</h1></header><main class="container owner-content"><nav class="owner-nav"><a class="" href="index.html">Overview</a><a class="" href="admins.html">Admins</a><a class="" href="clients.html">Clients</a><a class="active" href="orders.html">Orders</a><a class="" href="settings.html">Settings</a><a href="#" data-logout>Log Out</a></nav><section class="grid grid-3"><div class="stat"><span class="kpi">Orders</span><b id="orderCount">0</b></div><div class="stat"><span class="kpi">Completed</span><b id="completedCount">0</b></div><div class="stat"><span class="kpi">Commission Total</span><b id="commissionTotal">$0.00</b></div></section><section class="card" style="margin-top:16px"><div class="section-head"><h2 class="section-title" style="margin:0">Recent Orders</h2><button id="refresh" class="btn secondary" type="button">Refresh</button></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Client</th><th>Title</th><th>Amount</th><th>Status</th><th>Commission</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="config.js"></script><script type="module">import {init,api} from './scripts/common.js';if(init()){const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=async()=>{try{const d=await api('/owner/overview');const clients=Object.fromEntries(d.clients.map(c=>[c.id,c.name]));const orders=[...(d.orders||[])].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));orderCount.textContent=orders.length;completedCount.textContent=orders.filter(x=>x.status==='completed').length;commissionTotal.textContent='$'+orders.reduce((s,x)=>s+Number(x.commissionAmount||0),0).toFixed(2);rows.innerHTML=orders.map(x=>`<tr><td>${esc(clients[x.clientId]||'—')}</td><td>${esc(x.title||'Order')}</td><td>$${Number(x.amount||0).toFixed(2)}</td><td><span class="pill ${x.status==='completed'?'success':x.status==='cancelled'?'danger':''}">${esc(x.status)}</span></td><td>$${Number(x.commissionAmount||0).toFixed(2)}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6">No orders yet.</td></tr>'}catch(e){rows.innerHTML=`<tr><td colspan="6">${esc(e.message)}</td></tr>`}};refresh.onclick=render;await render()}}</script><script src="/shared/scripts/responsive.js" defer></script></body></html>
